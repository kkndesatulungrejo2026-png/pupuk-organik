<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dokumentasi Pupuk Organik</title>

    <style>
        body {
    margin: 0;
    padding: 40px;
    font-family: Arial, sans-serif;

    background: linear-gradient(
        135deg,
        #d3cbb6 0%,
        #e8e4d7 50%,
        #cdd5c0 100%
    );

    min-height: 100vh;
    text-align: center;
}

h1 {
    color: #3f4930;
}

.foto {
    margin: 30px auto;
    max-width: 900px;

    background: rgba(255, 255, 255, 0.85);

    padding: 30px;
    border-radius: 20px;

    box-shadow: 0 8px 25px rgba(68, 73, 48, 0.15);
}

.foto img {
    width: 100%;
    max-width: 800px;
    height: auto;
    display: block;
    margin: auto;
    border-radius: 10px;
}

.kembali {
    display: inline-block;
    margin-top: 30px;
    padding: 12px 25px;
    background: #3f4930;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}
    </style>

</head>

<body>

    <h1>📸 Dokumentasi Kegiatan</h1>

    <p>
        Dokumentasi kegiatan pembuatan pupuk organik

    </p>

    <div class="foto">

            src="foto-bersama/dokumentasi1.jpeg"
            alt="Dokumentasi kegiatan">

    </div>

     <div class="foto">

        <img
            src="foto-bersama/dokumentasi2.jpg"
            alt="Dokumentasi kegiatan">

    </div>
    
<div class="video">

</div>

 <div class="foto">
